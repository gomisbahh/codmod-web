<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Application Modernization Assessment</title>
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Background decorative glowing orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="login-container">
    <div class="card login-card">
      <div class="login-header">
        <svg class="logo-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 22h20L12 2z" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M12 7l-7 12h14L12 7z" fill="url(#logo-grad-fill)"/>
          <defs>
            <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="50%" stop-color="#34A853"/>
              <stop offset="100%" stop-color="#FBBC05"/>
            </linearGradient>
            <linearGradient id="logo-grad-fill" x1="5" y1="7" x2="19" y2="19" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4285F4" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#EA4335" stop-opacity="0.6"/>
            </linearGradient>
          </defs>
        </svg>
        <h2>Google Codmod</h2>
        <p>Application Modernization Assessment</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="passcode">Enter App Passcode</label>
          <input type="password" id="passcode" name="passcode" placeholder="••••••••" required autofocus>
          <span class="error-message" id="error-message" hidden>Incorrect passcode. Please try again.</span>
        </div>

        <button type="submit" id="login-btn" class="btn-primary">
          <span>Unlock Dashboard</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
